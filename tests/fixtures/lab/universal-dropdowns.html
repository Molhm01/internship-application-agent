<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Universal dropdown application — fixture</title>
  </head>
  <body>
    <!--
      One page carrying every dropdown shape that failed on a live application.

      Nothing here is styled and nothing here is decorative. Each control
      reproduces a real widget family: a native select, a select rebuilt by its
      parent, an ARIA combobox, a button-driven menu, a menu mounted into a
      portal, a searchable list, a list that does not exist until the control is
      opened, and a question nothing saved can answer. Every value is fictional.

      The submit button at the bottom is here to be *not* clicked.
    -->
    <h1>Application</h1>
    <form id="application" onsubmit="return false;">
      <fieldset>
        <legend>Personal Information</legend>

        <label for="firstName">First Name *</label>
        <input id="firstName" name="firstName" type="text" required />

        <label for="lastName">Last Name *</label>
        <input id="lastName" name="lastName" type="text" required />

        <label for="email">Email Address *</label>
        <input id="email" name="email" type="email" required />

        <label for="addressLine1">Street Address *</label>
        <input id="addressLine1" name="addressLine1" type="text" required />

        <label for="city">City *</label>
        <input id="city" name="city" type="text" required />

        <label for="postalCode">Zip/Postal Code *</label>
        <input id="postalCode" name="postalCode" type="text" required />

        <!-- 1. Native country select. -->
        <label for="country">Country *</label>
        <select id="country" name="country" required>
          <option value="">No Selection</option>
          <option value="CA">Canada</option>
          <option value="MX">Mexico</option>
          <option value="US">United States of America</option>
        </select>

        <!-- 2. Dependent state select: empty until Country is chosen, and
             replaced rather than mutated, exactly as the live page does it. -->
        <label for="state">State/Province *</label>
        <select id="state" name="state" required>
          <option value="">Select a country first</option>
        </select>

        <!-- 4. ARIA combobox: a button trigger with a listbox rendered on open. -->
        <label id="phoneTypeLabel">Phone Type *</label>
        <div id="phoneType" class="combobox" data-required="true">
          <button
            id="phoneTypeTrigger"
            type="button"
            role="combobox"
            aria-expanded="false"
            aria-controls="phoneTypeList"
            aria-haspopup="listbox"
            aria-labelledby="phoneTypeLabel"
          >
            <span class="value" data-selected-label></span>
          </button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Education</legend>

        <!-- 5. React-style custom dropdown: a div that renders its menu on
             mousedown and rerenders the trigger's own text afterwards. -->
        <label id="educationTypeLabel">Highest Level of Education *</label>
        <div id="educationType" class="react-select">
          <div
            id="educationTypeTrigger"
            role="combobox"
            tabindex="0"
            aria-expanded="false"
            aria-labelledby="educationTypeLabel"
          >
            <span class="singleValue"></span>
          </div>
        </div>

        <!-- 6. Portal-rendered dropdown: the menu is mounted into #portal-root,
             where no ancestor relationship to the trigger survives. -->
        <label id="educationCountryLabel">Education Country *</label>
        <div id="educationCountry" class="portal-select">
          <button
            id="educationCountryTrigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="educationCountryMenu"
            aria-labelledby="educationCountryLabel"
          >
            <span data-selected-label></span>
          </button>
        </div>

        <!-- 8. Dependent on Education Country, and also portal-rendered. -->
        <label id="educationStateLabel">Education State/Province *</label>
        <div id="educationState" class="portal-select">
          <button
            id="educationStateTrigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="educationStateMenu"
            aria-labelledby="educationStateLabel"
          >
            <span data-selected-label></span>
          </button>
        </div>

        <!-- 7. Searchable school combobox: nothing exists until it is typed in. -->
        <label for="school">School/Institution Name *</label>
        <div id="schoolRoot">
          <input
            id="school"
            name="school"
            type="text"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="schoolList"
            aria-expanded="false"
            autocomplete="off"
            required
          />
          <ul id="schoolList" role="listbox"></ul>
        </div>

        <!-- 9. Area of study: the saved subject is not on the list, and the
             form's own "Other" entry is the honest answer. -->
        <label for="areaOfStudy">Area of Study *</label>
        <select id="areaOfStudy" name="areaOfStudy" required>
          <option value="">No Selection</option>
          <option value="nursing">Nursing</option>
          <option value="history">History</option>
          <option value="accounting">Accounting</option>
          <option value="other">Other</option>
        </select>
        <label for="areaOfStudyOther">If other, please specify</label>
        <input id="areaOfStudyOther" name="areaOfStudyOther" type="text" />

        <!-- 10. Lazy-loaded yes/no: the options do not exist until it opens. -->
        <label id="graduatedLabel">Graduated?</label>
        <div id="graduated" class="lazy-select">
          <button
            id="graduatedTrigger"
            type="button"
            role="combobox"
            aria-expanded="false"
            aria-controls="graduatedList"
            aria-labelledby="graduatedLabel"
          >
            <span class="value"></span>
          </button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Work Experience</legend>

        <!-- 11 & 12. Facts nobody has saved. These must never be guessed. -->
        <label for="employmentType">Employment Type</label>
        <select id="employmentType" name="employmentType">
          <option value="">No Selection</option>
          <option value="ft">Full-Time</option>
          <option value="pt">Part-Time</option>
          <option value="intern">Internship</option>
        </select>

        <label for="reasonForLeaving">Reason for Leaving</label>
        <select id="reasonForLeaving" name="reasonForLeaving">
          <option value="">No Selection</option>
          <option value="better">Better opportunity</option>
          <option value="relocation">Relocation</option>
          <option value="school">Returned to school</option>
        </select>

        <!-- 16. Intentionally unanswerable: a company-specific fact. -->
        <label for="relativesEmployed">Do you have relatives employed by the company?</label>
        <select id="relativesEmployed" name="relativesEmployed">
          <option value="">No Selection</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Job-Specific Questions</legend>

        <!-- 13 & 14. Eligibility facts, answered only from saved eligibility. -->
        <label for="workAuthorization"
          >Are you legally authorized to work in the United States? *</label
        >
        <select id="workAuthorization" name="workAuthorization" required>
          <option value="">No Selection</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <label for="sponsorship"
          >Will you now or in the future require sponsorship for employment visa status? *</label
        >
        <select id="sponsorship" name="sponsorship" required>
          <option value="">No Selection</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <label for="source">How did you hear about this position?</label>
        <select id="source" name="source">
          <option value="">No Selection</option>
          <option value="referral">Employee Referral</option>
          <option value="jobboard">Job Board</option>
          <option value="career-center">College Career Center</option>
          <option value="website">Company Website</option>
        </select>

        <!-- 17. Known answer, and the list does not offer it. -->
        <label for="birthCountry">Country of Birth</label>
        <select id="birthCountry" name="birthCountry">
          <option value="">No Selection</option>
          <option value="CA">Canada</option>
          <option value="MX">Mexico</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Voluntary Self-Identification</legend>

        <!--
          15. A fictional sensitive-shaped question.

          Deliberately not a real protected characteristic: the point is to prove
          the engine can physically select an explicitly supplied answer on a
          control of this shape, and proving that with race, sex, veteran status,
          or disability would mean putting a real identity answer in a fixture.
          Every value below is invented.
        -->
        <label for="fixtureHouse">Which fictional house do you belong to? (voluntary)</label>
        <select id="fixtureHouse" name="fixtureHouse">
          <option value="">No Selection</option>
          <option value="north">Northwind</option>
          <option value="ember">Emberfell</option>
          <option value="tide">Tidewatch</option>
          <option value="decline">I decline to answer</option>
        </select>
      </fieldset>

      <!-- 18. Never clicked, by any code path, ever. -->
      <button id="submit" type="submit">Submit Application</button>
    </form>

    <div id="portal-root"></div>

    <script>
      (function () {
        var STATES = {
          US: [
            ['', 'No Selection'],
            ['NJ', 'New Jersey'],
            ['NY', 'New York'],
            ['CA', 'California'],
          ],
          CA: [
            ['', 'No Selection'],
            ['ON', 'Ontario'],
            ['BC', 'British Columbia'],
          ],
          MX: [
            ['', 'No Selection'],
            ['JAL', 'Jalisco'],
          ],
        };

        // The cascade: the dependent control is *replaced*, so every reference
        // taken before the parent was chosen is stale.
        document.getElementById('country').addEventListener('change', function (event) {
          var previous = document.getElementById('state');
          var replacement = document.createElement('select');
          replacement.id = 'state';
          replacement.name = 'state';
          replacement.required = true;
          var rows = STATES[event.target.value] || [['', 'Select a country first']];
          rows.forEach(function (row) {
            var option = document.createElement('option');
            option.value = row[0];
            option.textContent = row[1];
            replacement.append(option);
          });
          previous.replaceWith(replacement);
        });

        /** An ARIA combobox whose listbox is rendered on open. */
        function ariaCombobox(rootId, triggerId, listId, labels) {
          var root = document.getElementById(rootId);
          var trigger = document.getElementById(triggerId);
          trigger.addEventListener('click', function () {
            if (document.getElementById(listId)) return;
            var list = document.createElement('ul');
            list.id = listId;
            list.setAttribute('role', 'listbox');
            labels.forEach(function (label) {
              var item = document.createElement('li');
              item.setAttribute('role', 'option');
              item.textContent = label;
              item.addEventListener('click', function () {
                root.querySelector('.value').textContent = label;
                item.setAttribute('aria-selected', 'true');
                list.remove();
                trigger.setAttribute('aria-expanded', 'false');
              });
              list.append(item);
            });
            root.append(list);
            trigger.setAttribute('aria-expanded', 'true');
          });
        }

        ariaCombobox('phoneType', 'phoneTypeTrigger', 'phoneTypeList', ['Cell', 'Home', 'Work']);

        /** A React-style control that opens on mousedown and rerenders its trigger. */
        (function reactSelect() {
          var root = document.getElementById('educationType');
          var trigger = document.getElementById('educationTypeTrigger');
          trigger.addEventListener('mousedown', function () {
            if (document.getElementById('educationTypeMenu')) return;
            var menu = document.createElement('div');
            menu.id = 'educationTypeMenu';
            menu.setAttribute('role', 'listbox');
            ['High School', "Bachelor's Degree", "Master's Degree", 'Doctorate'].forEach(
              function (label) {
                var item = document.createElement('div');
                item.setAttribute('role', 'option');
                item.textContent = label;
                item.addEventListener('click', function () {
                  // A controlled component: the trigger's text is replaced, and
                  // the whole menu is discarded.
                  root.querySelector('.singleValue').textContent = label;
                  menu.remove();
                  trigger.setAttribute('aria-expanded', 'false');
                });
                menu.append(item);
              },
            );
            root.append(menu);
            trigger.setAttribute('aria-expanded', 'true');
          });
        })();

        /** A menu mounted into the portal root, far from its trigger. */
        function portalSelect(rootId, triggerId, menuId, labelsFor, onChoose) {
          var root = document.getElementById(rootId);
          var trigger = document.getElementById(triggerId);
          var portal = document.getElementById('portal-root');
          trigger.addEventListener('mousedown', function () {
            if (document.getElementById(menuId)) return;
            var menu = document.createElement('div');
            menu.id = menuId;
            menu.setAttribute('role', 'menu');
            labelsFor().forEach(function (label) {
              var item = document.createElement('div');
              item.setAttribute('role', 'menuitem');
              item.textContent = label;
              item.addEventListener('click', function () {
                root.querySelector('[data-selected-label]').textContent = label;
                menu.remove();
                trigger.setAttribute('aria-expanded', 'false');
                if (onChoose) onChoose(label);
              });
              menu.append(item);
            });
            portal.append(menu);
            trigger.setAttribute('aria-expanded', 'true');
          });
        }

        var educationCountry = '';
        portalSelect(
          'educationCountry',
          'educationCountryTrigger',
          'educationCountryMenu',
          function () {
            return ['Canada', 'Mexico', 'United States of America'];
          },
          function (label) {
            educationCountry = label;
          },
        );
        // The second half of the cascade: this menu's contents depend on what
        // the control above settled on, and do not exist until then.
        portalSelect('educationState', 'educationStateTrigger', 'educationStateMenu', function () {
          if (educationCountry === 'United States of America') {
            return ['New Jersey', 'New York', 'California'];
          }
          if (educationCountry === 'Canada') return ['Ontario', 'British Columbia'];
          return [];
        });

        /** A searchable list that renders only what the query matches. */
        (function searchableSchool() {
          var input = document.getElementById('school');
          var list = document.getElementById('schoolList');
          var schools = [
            'Rutgers University',
            'Rowan University',
            'Princeton University',
            'Montclair State University',
          ];
          input.addEventListener('input', function () {
            list.innerHTML = '';
            var query = input.value.trim().toLowerCase();
            if (query.length === 0) {
              input.setAttribute('aria-expanded', 'false');
              return;
            }
            schools
              .filter(function (name) {
                return name.toLowerCase().indexOf(query) !== -1;
              })
              .forEach(function (name) {
                var item = document.createElement('li');
                item.setAttribute('role', 'option');
                item.textContent = name;
                item.addEventListener('click', function () {
                  input.value = name;
                  list.innerHTML = '';
                  input.setAttribute('aria-expanded', 'false');
                });
                list.append(item);
              });
            input.setAttribute('aria-expanded', 'true');
          });
        })();

        /** A list whose options arrive a frame after the control opens. */
        (function lazyGraduated() {
          var root = document.getElementById('graduated');
          var trigger = document.getElementById('graduatedTrigger');
          trigger.addEventListener('click', function () {
            if (document.getElementById('graduatedList')) return;
            var list = document.createElement('ul');
            list.id = 'graduatedList';
            list.setAttribute('role', 'listbox');
            root.append(list);
            trigger.setAttribute('aria-expanded', 'true');
            setTimeout(function () {
              ['Yes', 'No'].forEach(function (label) {
                var item = document.createElement('li');
                item.setAttribute('role', 'option');
                item.textContent = label;
                item.addEventListener('click', function () {
                  root.querySelector('.value').textContent = label;
                  list.remove();
                  trigger.setAttribute('aria-expanded', 'false');
                });
                list.append(item);
              });
            }, 40);
          });
        })();

        // Proof that nothing submits: if a code path ever clicked it, this
        // records the fact where a test can see it.
        document.getElementById('submit').addEventListener('click', function () {
          document.body.setAttribute('data-submitted', 'true');
        });
      })();
    </script>
  </body>
</html>
