<!doctype html>
<html>
  <body>
    <form>
      <div class="form-field">
        <label for="email">Email Address *</label>
        <input
          id="email"
          type="email"
          aria-invalid="true"
          aria-describedby="email-help email-error"
          required
        />
        <p id="email-help" class="help">Use the address you check most often.</p>
        <p id="email-error" role="alert">Enter a valid email address.</p>
      </div>
    </form>
  </body>
</html>
