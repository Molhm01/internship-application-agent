<!doctype html>
<html>
  <body>
    <form>
      <label id="state-label">State or Province</label>
      <div
        role="combobox"
        tabindex="0"
        aria-labelledby="state-label"
        aria-controls="states"
        aria-expanded="false"
      ></div>
      <div id="states" role="listbox">
        <div role="option" data-value="MA">Massachusetts</div>
        <div role="option" data-value="NY">New York</div>
      </div>
    </form>
  </body>
</html>
