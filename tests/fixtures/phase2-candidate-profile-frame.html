<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Additional details</title>
  </head>
  <body>
    <!--
      The nested frame carries a control whose name, id and label are identical
      to one in the parent document. Two frames are two places; collapsing them
      fills one and reports both.
    -->
    <h2 id="frame-section-heading">Addresses (1)* required.</h2>
    <p class="instructions">Provide the address on file with your employer.</p>
    <div class="field">
      <label for="addressLine1">Address Line 1</label>
      <input id="addressLine1" name="addressLine1" type="text" required />
    </div>
  </body>
</html>
