<!doctype html>
<html>
  <body>
    <main data-automation-id="jobPostingPage">
      <h1 data-automation-id="jobPostingHeader">Data Science Intern</h1>
      <p data-automation-id="locations">New York, NY</p>
      <p data-automation-id="requisitionId">REQ-2026-42</p>
      <form>
        <div data-automation-id="formField-legalName">
          <label for="legalName">Legal First Name</label><input id="legalName" required />
        </div>
        <div data-automation-id="formField-country">
          <label id="countryLabel">Country</label
          ><button
            type="button"
            role="combobox"
            aria-labelledby="countryLabel"
            data-automation-id="country"
          ></button>
        </div>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
